name: Publish EIP-8141 dev image

# Builds and publishes the ethrex binary that Skandha's frame-tx e2e test
# depends on (Dockerfile's ENTRYPOINT is `ethrex`; the image carries a
# release build with the `dev`/Hegota-capable feature set already on by
# default). Skandha's own CI pulls this image rather than building ethrex
# from source on every run - see test/e2e/ethrex-devnet.sh and
# .github/workflows/frame-tx-e2e.yml in the skandha repo.

on:
  push:
    branches:
      - eip8141-tracer
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and push eip8141-tracer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:eip8141-tracer-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and push Docker image
        id: push
        uses: ./.github/actions/build-docker
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          push: true
          variant: eip8141
          # :eip8141-tracer-latest is what the devnet image (below) builds
          # from; the sha tag makes a specific build reproducible/pinnable.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:eip8141-tracer-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:eip8141-tracer-${{ github.sha }}

  build-and-push-devnet-image:
    name: Build and push e2e devnet image
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # A distinct image, not just another ethrex tag: this fork isn't
    # Skandha's ethrex anymore, and this image isn't "plain ethrex" either -
    # it bundles the Hegota genesis + dev keys an e2e test needs, which a
    # general-purpose execution-client image has no business carrying.
    env:
      DEVNET_IMAGE_NAME: forshtat/eip8141-devnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push devnet image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.e2e-devnet
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.build-and-push-image.outputs.base_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.DEVNET_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.DEVNET_IMAGE_NAME }}:${{ github.sha }}
